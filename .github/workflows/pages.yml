name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The Maps key lives only in the GMAPS_KEY repo secret, never in git.
      - name: Build site with Maps key
        env:
          GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
        run: |
          mkdir -p _site
          # home page + one folder per trip (e.g. furano-2027/index.html)
          for f in index.html */index.html; do
            case "$f" in app-example-images/*|_site/*) continue ;; esac
            mkdir -p "_site/$(dirname "$f")"
            sed "s/__GMAPS_KEY__/${GMAPS_KEY}/g" "$f" > "_site/$f"
          done
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
