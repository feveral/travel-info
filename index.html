<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我們的旅行</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --text:#121826; --muted:#5b6475; --line:#e2e6ee;
  --accent:#0f9d8a; --accent-soft:#e3f6f2; --warn:#b4540a; --warn-soft:#fff3e4;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2539; --text:#e8edf6; --muted:#97a3b8; --line:#243149;
    --accent:#3fd9be; --accent-soft:#12302e; --warn:#ffb36b; --warn-soft:#33240f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2539; --text:#e8edf6; --muted:#97a3b8; --line:#243149;
  --accent:#3fd9be; --accent-soft:#12302e; --warn:#ffb36b; --warn-soft:#33240f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(40px + env(safe-area-inset-top)) 0 8px;position:relative}
header .eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted)}
header h1{font-size:30px;line-height:1.25;margin:4px 0 4px}
header p{margin:0;color:var(--muted);font-size:14px}
.theme-toggle{position:absolute;right:0;top:calc(12px + env(safe-area-inset-top));background:var(--surface);
  border:1px solid var(--line);color:var(--text);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer}
h2{font-size:15px;color:var(--muted);font-weight:600;margin:24px 4px 8px}
.trip{display:block;position:relative;border-radius:20px;overflow:hidden;margin:12px 0;color:#fff;text-decoration:none;
  min-height:220px;background:#0b1220 center/cover no-repeat;box-shadow:var(--shadow);
  transition:transform .15s ease}
.trip:active{transform:scale(.985)}
.trip::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,20,.05) 20%,rgba(5,10,20,.85) 100%)}
.trip .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px 18px 18px}
.trip .dates{font-size:13px;opacity:.9;letter-spacing:.04em}
.trip h3{font-size:24px;line-height:1.3;margin:2px 0 4px}
.trip .sub{font-size:14px;opacity:.9}
.trip .status{position:absolute;right:14px;top:14px;z-index:1;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.trip .status.now{background:#e8590c;border-color:#e8590c}
.trip .status.soon{background:var(--accent);border-color:var(--accent);color:#fff}
.trip.past{min-height:150px}
.trip.past::after{background:linear-gradient(180deg,rgba(5,10,20,.25) 0%,rgba(5,10,20,.85) 100%)}
.trip.past h3{font-size:20px}
.footer{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 24px}
@media (max-width:480px){ .wrap{padding:0 12px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="theme-toggle" id="themeBtn" aria-label="切換深淺色">◐</button>
    <div class="eyebrow">TRAVEL INFO</div>
    <h1>我們的旅行 ✈️</h1>
    <p>每趟旅程的行程、航班、住宿和行前清單</p>
  </header>
  <div id="trips"></div>
  <div class="footer">照片：Wikimedia Commons（各作者，CC 授權）</div>
</div>
<script>
// Add a new trip here: put its site in its own folder and list it below.
const TRIPS = [
  { href:'furano-2027/', start:'2027-01-08', end:'2027-01-17', title:'北海道富良野滑雪', sub:'富良野滑雪場・美瑛・旭川・札幌美食',
    meta:'10 天 9 夜', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Furano_Snow_Resort_view2.JPG/960px-Furano_Snow_Resort_view2.JPG' },
  { href:'uk-iceland-2026/', start:'2026-10-31', end:'2026-11-08', title:'英國・冰島幸福極光之旅', sub:'倫敦・牛津・冰島南岸',
    meta:'9 天 7 夜', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Aurora_Borealis_-_Iceland_-_2_Nov._2013.jpg/960px-Aurora_Borealis_-_Iceland_-_2_Nov._2013.jpg' },
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const today = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
const dots = iso => iso.replace(/-/g, '.');
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function card(t) {
  const past = today > t.end, now = today >= t.start && !past;
  const left = days(today, t.start);
  const status = now ? `<span class="status now">🧳 旅行中・第 ${days(t.start, today) + 1} 天</span>`
    : past ? `<span class="status">已完成 ✓</span>`
    : `<span class="status soon">倒數 ${left} 天</span>`;
  return `<a class="trip ${past ? 'past' : ''}" href="${t.href}" style="background-image:url('${t.img}')">
    ${status}
    <div class="in"><div class="dates">${dots(t.start)} – ${dots(t.end).slice(5)}・${esc(t.meta)}</div>
    <h3>${esc(t.title)}</h3><div class="sub">${esc(t.sub)}</div></div></a>`;
}
function render() {
  const upcoming = TRIPS.filter(t => today <= t.end).sort((a, b) => a.start < b.start ? -1 : 1);
  const past = TRIPS.filter(t => today > t.end).sort((a, b) => a.start > b.start ? -1 : 1);
  $('#trips').innerHTML = (upcoming.length ? `<h2>即將出發</h2>${upcoming.map(card).join('')}` : '')
    + (past.length ? `<h2>去過的地方</h2>${past.map(card).join('')}` : '');
}
render();

const themeOrder = ['auto','light','dark'];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
let theme = store.get('theme', 'auto'); applyTheme(theme);
$('#themeBtn').onclick = () => { theme = themeOrder[(themeOrder.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(theme); };
</script>
</body>
</html>
